[package]
name = "stm-file"
version = "0.1.0"
edition = "2024"

[dependencies]
stm-core = { path = "../stm-core" }
stm-writer = { path = "../stm-writer" }
stm-parser = { path = "../stm-parser" }
stm-signature = { path = "../stm-signature" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mime_guess = "2.0"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.10"
